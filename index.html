<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Informações do dispositivo</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #101412; }
    body { display: grid; place-items: center; min-height: 100vh; color: #f2f5f1; font: 16px sans-serif; }
    main { width: min(520px, calc(100% - 40px)); padding: 32px 0; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { color: #c4cdc5; line-height: 1.5; }
    button { margin-top: 16px; border: 0; border-radius: 6px; padding: 14px 22px; background: #d5f36b; color: #101412; font: inherit; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    #status { min-height: 24px; margin-top: 22px; color: #d5f36b; }
  </style>
</head>
<body>
  <main>
    <h1>Informações do dispositivo</h1>
    <p>Ao continuar, o site solicitará a sua localização e enviará a posição e alguns dados técnicos do dispositivo para o e-mail do responsável pelo projeto.</p>
    <button id="start-button" type="button">Autorizar e enviar informações</button>
    <div id="status" role="status"></div>
  </main>
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZwyEB1zD2l0FqbG2E85Wn-dNT_8IsAVqKCY1rpwepG2icpcrEWWbiyR38Vncf3aQmJg/exec';
    const startButton = document.getElementById('start-button');
    const status = document.getElementById('status');
    function setStatus(message) { status.textContent = message; }
    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) { reject(new Error('Este navegador não suporta localização.')); return; }
        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
      });
    }
    async function sendAccessData() {
      const position = await getLocation();
      const data = {
        type: 'access', timestamp: new Date().toISOString(),
        location: { latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy: position.coords.accuracy, altitude: position.coords.altitude, heading: position.coords.heading, speed: position.coords.speed },
        device: { userAgent: navigator.userAgent, platform: navigator.platform, language: navigator.language, languages: navigator.languages, screen: { width: screen.width, height: screen.height, pixelRatio: devicePixelRatio }, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, online: navigator.onLine, cookiesEnabled: navigator.cookieEnabled }
      };
      await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    }
    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      setStatus('A solicitar a sua localização...');
      try { await sendAccessData(); setStatus('Informações enviadas com sucesso.'); }
      catch (error) { console.error(error); setStatus(`Não foi possível armazenar: ${error.message}`); startButton.disabled = false; }
    });
  </script>
</body>
</html>
